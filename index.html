<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Harsh & Dev Feeding & Diaper Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h2 { color: #333; }
    .baby-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; background: #fff; border-radius: 8px; }
    .log-container { display: flex; gap: 20px; margin-top: 15px; }
    .log-column { flex: 1; background: #fafafa; padding: 10px; border-radius: 5px; border: 1px solid #eee; }
    .entry { background: #eef; padding: 8px; margin-bottom: 8px; border-radius: 4px; font-size: 14px; }
    .timer { margin-top: 8px; margin-bottom: 10px; font-weight: bold; font-size: 13px; }
    label { display: block; margin-top: 10px; }
    select, textarea { width: 100%; padding: 6px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 12px; background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
  <h1>🍼 Harsh & Dev Feeding & Diaper Tracker</h1>

  <!-- Harsh Section -->
  <div class="baby-section" id="babyHarsh">
    <h2>Harsh</h2>
    <form onsubmit="logEvent(event, 'Harsh')">
      <label>Event Type:
        <select name="eventType">
          <option value="Feeding">Feeding</option>
          <option value="Diaper">Diaper Change</option>
        </select>
      </label>
      <label>Details:
        <select name="details">
          <option value="Breastfeeding">Breastfeeding</option>
          <option value="Bottle">Bottle</option>
          <option value="Solid Food">Solid Food</option>
          <option value="Wet">Wet Diaper</option>
          <option value="Dirty">Dirty Diaper</option>
          <option value="Mixed">Mixed Diaper</option>
        </select>
      </label>
      <label>Quantity/Notes:
        <textarea name="notes"></textarea>
      </label>
      <button type="submit">Log Event</button>
    </form>

    <div class="log-container">
      <div class="log-column">
        <h3>Feeding Logs (Last 5)</h3>
        <div class="timer" id="timerHarsh_feeding">⏱ Last feed: none</div>
        <div id="logHarsh_feeding"></div>
      </div>
      <div class="log-column">
        <h3>Diaper Logs (Last 5)</h3>
        <div class="timer" id="timerHarsh_diaper">⏱ Last diaper: none</div>
        <div id="logHarsh_diaper"></div>
      </div>
    </div>
  </div>

  <!-- Dev Section -->
  <div class="baby-section" id="babyDev">
    <h2>Dev</h2>
    <form onsubmit="logEvent(event, 'Dev')">
      <label>Event Type:
        <select name="eventType">
          <option value="Feeding">Feeding</option>
          <option value="Diaper">Diaper Change</option>
        </select>
      </label>
      <label>Details:
        <select name="details">
          <option value="Breastfeeding">Breastfeeding</option>
          <option value="Bottle">Bottle</option>
          <option value="Solid Food">Solid Food</option>
          <option value="Wet">Wet Diaper</option>
          <option value="Dirty">Dirty Diaper</option>
          <option value="Mixed">Mixed Diaper</option>
        </select>
      </label>
      <label>Quantity/Notes:
        <textarea name="notes"></textarea>
      </label>
      <button type="submit">Log Event</button>
    </form>

    <div class="log-container">
      <div class="log-column">
        <h3>Feeding Logs (Last 5)</h3>
        <div class="timer" id="timerDev_feeding">⏱ Last feed: none</div>
        <div id="logDev_feeding"></div>
      </div>
      <div class="log-column">
        <h3>Diaper Logs (Last 5)</h3>
        <div class="timer" id="timerDev_diaper">⏱ Last diaper: none</div>
        <div id="logDev_diaper"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // Your Firebase Configuration Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyA8_cUV3QeqWXuQD6wU0ebD3Cfab1CdekI",
      authDomain: "harshadevooda.firebaseapp.com",
      projectId: "harshadevooda",
      storageBucket: "harshadevooda.firebasestorage.app",
      messagingSenderId: "872746404759",
      appId: "1:872746404759:web:21672247fe365edcadd2d2",
      measurementId: "G-WWR07QV28M"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let lastEventTime = {
      Harsh: { feeding: null, diaper: null },
      Dev: { feeding: null, diaper: null }
    };

    // Function to submit new logs to Firebase
    window.logEvent = async function(event, baby) {
      event.preventDefault();
      const form = event.target;
      const type = form.eventType.value;
      const details = form.details.value;
      const notes = form.notes.value;

      try {
        await addDoc(collection(db, "baby_logs"), {
          baby_name: baby,
          event_type: type,
          details: details,
          notes: notes,
          created_at: serverTimestamp()
        });
        form.reset();
      } catch (error) {
        console.error("Error adding document: ", error);
        alert("Error saving log!");
      }
    };

    // Function to render columns and capture latest timestamps
    function renderLogs(baby, docs) {
      const feedingDiv = document.getElementById('log' + baby + '_feeding');
      const diaperDiv = document.getElementById('log' + baby + '_diaper');
      feedingDiv.innerHTML = '';
      diaperDiv.innerHTML = '';

      let entries = docs.map(doc => doc.data()).filter(entry => entry.created_at);
      
      // Sort newest entries first based on timestamp
      entries.sort((a, b) => b.created_at.toMillis() - a.created_at.toMillis());

      let feedingEntries = entries.filter(entry => entry.event_type === 'Feeding');
      let diaperEntries = entries.filter(entry => entry.event_type === 'Diaper');

      // Track last event times separately for timers
      lastEventTime[baby].feeding = feedingEntries.length > 0 ? feedingEntries[0].created_at.toDate() : null;
      lastEventTime[baby].diaper = diaperEntries.length > 0 ? diaperEntries[0].created_at.toDate() : null;

      // Render last 5 feeding logs
      feedingEntries.slice(0, 5).forEach(entry => {
        const dateObj = entry.created_at.toDate();
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `<strong>${dateObj.toLocaleString()}</strong><br>Details: ${entry.details}<br>Notes: ${entry.notes || 'None'}`;
        feedingDiv.appendChild(div);
      });

      // Render last 5 diaper logs
      diaperEntries.slice(0, 5).forEach(entry => {
        const dateObj = entry.created_at.toDate();
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `<strong>${dateObj.toLocaleString()}</strong><br>Details: ${entry.details}<br>Notes: ${entry.notes || 'None'}`;
        diaperDiv.appendChild(div);
      });
    }

    // Real-time listener for each baby
    ['Harsh', 'Dev'].forEach(baby => {
      const q = query(
        collection(db, "baby_logs"),
        where("baby_name", "==", baby)
      );

      onSnapshot(q, (snapshot) => {
        renderLogs(baby, snapshot.docs);
      }, (error) => {
        console.error("Realtime fetch error for " + baby + ": ", error);
      });
    });

    // Update separate timers with color thresholds every second
    function updateTimers() {
      ['Harsh', 'Dev'].forEach(baby => {
        // --- Feeding Timer ---
        const feedTimerDiv = document.getElementById('timer' + baby + '_feeding');
        const feedTime = lastEventTime[baby].feeding;
        if (feedTime) {
          const diffMs = new Date() - feedTime;
          const diffMins = Math.floor(diffMs / 60000);
          const hours = Math.floor(diffMins / 60);
          const minutes = diffMins % 60;
          const secs = Math.floor((diffMs % 60000) / 1000);

          let timeStr = hours > 0 ? `${hours} hr ${minutes} min ago` : `${minutes} min ${secs} sec ago`;
          feedTimerDiv.textContent = `⏱ Last feed: ${timeStr}`;

          // Feeding rules: < 2h (120 mins) Green, 2h-5h Yellow, > 5h Red
          if (diffMins < 120) {
            feedTimerDiv.style.color = '#2e7d32'; // Green
          } else if (diffMins <= 300) {
            feedTimerDiv.style.color = '#d4ac0d'; // Yellow
          } else {
            feedTimerDiv.style.color = '#d9534f'; // Red
          }
        } else {
          feedTimerDiv.textContent = `⏱ Last feed: none`;
          feedTimerDiv.style.color = '#666';
        }

        // --- Diaper Timer ---
        const diaperTimerDiv = document.getElementById('timer' + baby + '_diaper');
        const diaperTime = lastEventTime[baby].diaper;
        if (diaperTime) {
          const diffMs = new Date() - diaperTime;
          const diffMins = Math.floor(diffMs / 60000);
          const hours = Math.floor(diffMins / 60);
          const minutes = diffMins % 60;
          const secs = Math.floor((diffMs % 60000) / 1000);

          let timeStr = hours > 0 ? `${hours} hr ${minutes} min ago` : `${minutes} min ${secs} sec ago`;
          diaperTimerDiv.textContent = `⏱ Last diaper: ${timeStr}`;

          // Diaper rules: < 3h (180 mins) Green, 3h-5h Yellow, > 5h Red
          if (diffMins < 180) {
            diaperTimerDiv.style.color = '#2e7d32'; // Green
          } else if (diffMins <= 300) {
            diaperTimerDiv.style.color = '#d4ac0d'; // Yellow
          } else {
            diaperTimerDiv.style.color = '#d9534f'; // Red
          }
        } else {
          diaperTimerDiv.textContent = `⏱ Last diaper: none`;
          diaperTimerDiv.style.color = '#666';
        }
      });
    }

    setInterval(updateTimers, 1000);
  </script>
</body>
</html>
