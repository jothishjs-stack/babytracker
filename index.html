<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <title>Baby Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h2 { color: #333; }
    .baby-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; background: #fff; }
    .log-container { display: flex; gap: 20px; }
    .log-column { flex: 1; }
    .entry { background: #eef; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    .timer { margin-top: 10px; font-weight: bold; color: #d9534f; }
    label { display: block; margin-top: 10px; }
    select, textarea { width: 100%; padding: 6px; margin-top: 5px; }
    button { margin-top: 10px; padding: 8px 12px; background: #4CAF50; color: white; border: none; cursor: pointer; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
  <h1>🍼 Harsh & Dev Feeding & Diaper Tracker</h1>

  <!-- Harsh Section -->
  <div class="baby-section" id="babyHarsh">
    <h2>Harsh</h2>
    <form onsubmit="logEvent(event, 'Harsh')">
      <label>Event Type:
        <select name="eventType">
          <option value="Feeding">Feeding</option>
          <option value="Diaper">Diaper Change</option>
        </select>
      </label>
      <label>Details:
        <select name="details">
          <option value="Breastfeeding">Breastfeeding</option>
          <option value="Bottle">Bottle</option>
          <option value="Solid Food">Solid Food</option>
          <option value="Wet">Wet Diaper</option>
          <option value="Dirty">Dirty Diaper</option>
          <option value="Mixed">Mixed Diaper</option>
        </select>
      </label>
      <label>Quantity/Notes:
        <textarea name="notes"></textarea>
      </label>
      <button type="submit">Log Event</button>
    </form>
    <div class="timer" id="timerHarsh">⏱ Last event: none</div>
    <div class="log-container">
      <div class="log-column">
        <h3>Feeding Logs</h3>
        <div class="log" id="logHarsh_feeding"></div>
      </div>
      <div class="log-column">
        <h3>Diaper Logs</h3>
        <div class="log" id="logHarsh_diaper"></div>
      </div>
    </div>
  </div>

  <!-- Dev Section -->
  <div class="baby-section" id="babyDev">
    <h2>Dev</h2>
    <form onsubmit="logEvent(event, 'Dev')">
      <label>Event Type:
        <select name="eventType">
          <option value="Feeding">Feeding</option>
          <option value="Diaper">Diaper Change</option>
        </select>
      </label>
      <label>Details:
        <select name="details">
          <option value="Breastfeeding">Breastfeeding</option>
          <option value="Bottle">Bottle</option>
          <option value="Solid Food">Solid Food</option>
          <option value="Wet">Wet Diaper</option>
          <option value="Dirty">Dirty Diaper</option>
          <option value="Mixed">Mixed Diaper</option>
        </select>
      </label>
      <label>Quantity/Notes:
        <textarea name="notes"></textarea>
      </label>
      <button type="submit">Log Event</button>
    </form>
    <div class="timer" id="timerDev">⏱ Last event: none</div>
    <div class="log-container">
      <div class="log-column">
        <h3>Feeding Logs</h3>
        <div class="log" id="logDev_feeding"></div>
      </div>
      <div class="log-column">
        <h3>Diaper Logs</h3>
        <div class="log" id="logDev_diaper"></div>
      </div>
    </div>
  </div>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://svsufkmkvdlsqkbmaith.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2c3Vma21rdmRsc3FrYm1haXRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDU1NTQsImV4cCI6MjEwNzg4MTU1NH0.Y8qw6ZbwarBk301fR4R-7hbowdguzOKWb_8FVNijNkw"; // replace with your anon key
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let lastEventTime = { Harsh: null, Dev: null };

    async function logEvent(event, baby) {
      event.preventDefault();
      const form = event.target;
      const type = form.eventType.value;
      const details = form.details.value;
      const notes = form.notes.value;
      const time = new Date();

      // Insert into Supabase
      const { data, error } = await supabase
        .from('baby_logs')
        .insert([
          { baby_name: baby, event_type: type, details: details, notes: notes }
        ]);

      if (error) {
        console.error("Insert error:", error);
        alert("Error saving log!");
      } else {
        console.log("Inserted:", data);
        alert("Log saved for " + baby);
      }

      form.reset();
      lastEventTime[baby] = time;
    }

    function updateTimers() {
      ['Harsh','Dev'].forEach(baby => {
        const timerDiv = document.getElementById('timer' + baby);
        if (lastEventTime[baby]) {
          const diffMs = new Date() - lastEventTime[baby];
          const diffMins = Math.floor(diffMs / 60000);
          const hours = Math.floor(diffMins / 60);
          const minutes = diffMins % 60;
          const secs = Math.floor((diffMs % 60000) / 1000);

          timerDiv.textContent =
            hours > 0
              ? `⏱ Last event: ${hours} hr ${minutes} min ${secs} sec ago`
              : `⏱ Last event: ${minutes} min ${secs} sec ago`;
        }
      });
    }

    setInterval(updateTimers, 1000);
  </script>
</body>
</html>
